name: Storyboard
options:
  deploymentTarget:
    macOS: '15.0'
packages:
  Flux2Swift:
    url: https://github.com/VincentGourbin/flux-2-swift-mlx
    revision: 315c27e83187909bc5e1f880b4850918342d891b
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.31.4
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.6
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.3
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  Storyboard:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adachis.storyboard
        PRODUCT_NAME: SceneSketch
        PRODUCT_MODULE_NAME: SceneSketch
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Flux2Swift
        product: Flux2Core
      - package: Flux2Swift
        product: FluxTextEncoders
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - package: Transformers
        product: Tokenizers
    info:
      path: build/Info.plist
      properties:
        CFBundleIdentifier: com.adachis.storyboard
        CFBundleName: SceneSketch
        CFBundleDisplayName: SceneSketch
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '5'
        LSMinimumSystemVersion: '15.0'
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: SceneSketch storyboard
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.adachis.storyboard.document]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.adachis.storyboard.document
            UTTypeDescription: SceneSketch storyboard
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: sketchboard

  StoryboardCheck:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes: [StoryboardApp.swift]
      - path: Tools
    dependencies:
      - package: Flux2Swift
        product: Flux2Core
      - package: Flux2Swift
        product: FluxTextEncoders
      - package: MLXLM
        product: MLXVLM
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: MLX
        product: MLX
      - package: Transformers
        product: Tokenizers
